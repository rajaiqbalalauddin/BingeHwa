# Checks MangaDex for new chapters of every watched series and sends push alerts.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (see README). GitHub may delay
# scheduled runs by several minutes, so alerts are "about every 15 minutes", not exact.
name: Check new chapters
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print decisions, send nothing)'
        type: boolean
        default: false
concurrency:
  group: chapter-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - name: Check and notify
        working-directory: worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not set yet. Skipping."
            exit 0
          fi
          node src/run.mjs
